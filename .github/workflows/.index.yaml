name: Index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main mid-release, or the release is created but no image published
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # What a pull request needs: each check runs only when its own files, or this
  # workflow, changed. A push to main or a manual run checks everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.diff.outputs.projects }}
      resources: ${{ steps.diff.outputs.resources }}
      tofu: ${{ steps.diff.outputs.tofu }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          WORKFLOW: '^\.github/workflows/\.index\.yaml$'
          PROJECTS: '^projects/'
          RESOURCES: '^(scripts/|gateway/|projects/|.*\.sh$|\.shellcheckrc$)'
          TOFU: '^(cluster/|develop/|gateway/Dockerfile$|\.trivyignore$)'
          IMAGE: '^(gateway/|projects/(library|project)/src/)'
        run: |
          if [ "$EVENT" != pull_request ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            for check in projects resources tofu image; do echo "$check=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          for check in projects resources tofu image; do
            pattern=$(printenv "${check^^}")
            if printf '%s\n' "$files" | grep -qE "$pattern|$WORKFLOW"; then value=true; else value=false; fi
            echo "$check=$value" | tee -a "$GITHUB_OUTPUT"
          done

  # forgepy's checks for the Jython scripts: ruff, basedpyright, the Jython 2.7
  # compatibility check and pytest, once per Ignition API (8.1 and 8.3), each with
  # that version's API stubs from its uv dependency group
  projects:
    name: Projects (Ignition ${{ matrix.ignition }} API)
    needs: changes
    if: needs.changes.outputs.projects == 'true'
    strategy:
      matrix:
        include:
          - ignition: "8.1"
            group: ignition81
          - ignition: "8.3"
            group: ignition83
    uses: apollogeddon/forgepy/.github/workflows/testing.yml@main
    permissions:
      contents: write
    with:
      working_directory: projects
      python_version: "3.12"
      sync_args: --no-default-groups --group dev --group ${{ matrix.group }}
      run_build: false
      # the webpage's checks already scan the repository for secrets
      enable_secrets: false
      # one job upgrades uv.lock's vulnerable packages on main
      auto_patch: ${{ matrix.group == 'ignition83' }}
      artifact_name: projects-${{ matrix.group }}

  resources:
    name: Resources and scripts
    needs: changes
    if: needs.changes.outputs.resources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # pinned, as the runner's shellcheck version changes what it reports
      - name: Install shellcheck
        env:
          VERSION: v0.11.0
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-$VERSION/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Sanitiser tests
        run: uv run --no-project --with pytest pytest -q scripts/tests
      - name: Project resources are sanitised
        run: git ls-files -z -- '*resource.json' | xargs -0 uv run --no-project scripts/sanitise.py --check
      - name: Asset installer tests
        run: bash gateway/tests/install-assets_test.sh
      - name: API key bootstrap tests
        run: bash gateway/tests/api-token_test.sh
      - name: Ignition versions match the pinned base images
        run: |
          bash scripts/tests/check-ignition-versions_test.sh
          scripts/check-ignition-versions.sh
      - name: 8.1 gateway events match the event script files
        run: |
          scripts/generate-event-scripts.sh
          git diff --exit-code -- 'projects/*/src/ignition/event-scripts' \
            || { echo "::error::run scripts/generate-event-scripts.sh and commit the result"; exit 1; }

  tofu:
    name: OpenTofu and config scan
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
      - run: tofu fmt -check -recursive cluster develop
      - name: Validate the modules and the infra stage
        run: |
          for dir in cluster/modules/platform cluster/modules/gateway cluster/environments/k3s/infra; do
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done
      # The Ignition provider is on no registry: the config stages install it from the
      # network mirror its docs site serves, as cluster/README.md tells users to
      - name: Validate the config stages
        run: |
          cat >"$RUNNER_TEMP/tofurc" <<'CONFIG'
          provider_installation {
            network_mirror {
              url     = "https://apollogeddon.github.io/ignition-tofu/providers/"
              include = ["registry.opentofu.org/apollogeddon/ignition"]
            }
            direct {
              exclude = ["registry.opentofu.org/apollogeddon/ignition"]
            }
          }
          CONFIG
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/tofurc"
          for dir in cluster/modules/resources cluster/environments/k3s/config develop/config; do
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done
      # misconfigurations in the OpenTofu code, the compose file and the Dockerfile
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # On main, after the checks: forgepy's release-please job opens or updates the release
  # pull request, asks for its review (a pull request opened with the workflow token starts
  # no workflow), and creates the release when it merges. The image job publishes that
  # release's images, as a tag created with GITHUB_TOKEN doesn't start a workflow.
  version:
    needs: [projects, resources, tofu]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    uses: apollogeddon/forgepy/.github/workflows/version.yml@main
    permissions:
      contents: write
      pull-requests: write

  image:
    name: Gateway image (Ignition ${{ matrix.ignition }})
    needs: [changes, projects, resources, version]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        ignition: ["8.1.55", "8.3.10"]
    permissions:
      contents: read
      packages: write
    env:
      # pull requests only build and test; main publishes to GHCR
      PUBLISH: ${{ github.event_name == 'push' }}
      RELEASE: ${{ needs.version.outputs.new_release_published == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          build-args: IGNITION_VERSION=${{ matrix.ignition }}
          load: true
          tags: ignition-gateway:test
          cache-from: type=gha,scope=${{ matrix.ignition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ignition }}
      - name: Smoke test
        run: gateway/tests/smoke.sh ignition-gateway:test
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ignition-gateway
          # every tag carries the Ignition version: 8.3.10-main, 8.3.10-sha-<commit>,
          # and for a release 8.3.10-<release version>
          flavor: prefix=${{ matrix.ignition }}-,onlatest=true
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ env.RELEASE }}
      - name: Publish
        id: publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          build-args: IGNITION_VERSION=${{ matrix.ignition }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.ignition }}
          # an SPDX SBOM and SLSA provenance, attached to the image in GHCR
          sbom: true
          provenance: mode=max
      # the publish step builds again from the cache, so test what it pushed: a
      # failure here keeps a release a draft (release-artifacts needs this job)
      - name: Smoke test the published image
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ignition-gateway@${{ steps.publish.outputs.digest }}
        run: gateway/tests/smoke.sh "$IMAGE"
      # the release's image by digest, for the release's images file
      - name: Record the release image
        if: env.RELEASE == 'true' && env.PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ignition-gateway:${{ matrix.ignition }}-${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" > "$RUNNER_TEMP/image.txt"
      - uses: actions/upload-artifact@v7
        if: env.RELEASE == 'true' && env.PUBLISH == 'true'
        with:
          name: release-image-${{ matrix.ignition }}
          path: ${{ runner.temp }}/image.txt
          retention-days: 1

  # release-please creates the release as a draft (.github/release.json), as a
  # published release is immutable: this job attaches the project exports, the
  # images by digest and their checksums, then publishes it. A release whose images
  # failed stays a draft.
  release-artifacts:
    name: Release artifacts
    needs: [version, image]
    if: ${{ !failure() && !cancelled() && needs.version.outputs.new_release_published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/images
      - name: Build the artifacts
        run: scripts/release-artifacts.sh "$VERSION" "$RUNNER_TEMP/release" "$RUNNER_TEMP"/images/*/image.txt
      - name: Attach them and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # every Markdown file in the repository; no shared workflow lints Markdown
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the root tooling installs @apollogeddon/forgejs from GitHub Packages
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: webpage/.nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@apollogeddon"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.{md,mdx}"

  # forgejs's website pipeline: Gitleaks over the whole repository (so it isn't path
  # filtered), OSV-Scanner, Biome, the type check and the build; on main, OSV security
  # patches and the GitHub Pages deploy. It also asks for a review of Dependabot's pull
  # requests, as CODEOWNERS doesn't on a bot's.
  webpage:
    needs: [markdown]
    uses: apollogeddon/forgejs/.github/workflows/website.yml@main
    # GitHub checks every called job's permissions, including the ones these inputs skip
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
      pull-requests: write
    with:
      working_directory: webpage
      run_tests: false
      enable_versioning: false
      auto_merge: false
      # the built site, served under its GitHub Pages path: its internal links, and every page
      # in the sitemap against WCAG 2.2 A and AA with axe
      base_path: /ignition-demo/
      check_links: true
      check_accessibility: true

  # last, so a Dependabot pull request merges only once every check above has passed
  auto-merge:
    needs: [projects, resources, tofu, image, webpage]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    uses: apollogeddon/forgepy/.github/workflows/merge.yml@main
    permissions:
      contents: write
      pull-requests: write
