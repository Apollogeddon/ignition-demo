name: Webpage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webpage-${{ github.ref }}
  # never cancel a run on main, or the site is left half deployed
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the root tooling installs @apollogeddon/forgejs from GitHub Packages
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: webpage/.nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@apollogeddon"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.{md,mdx}"

  # forgejs's website pipeline: Gitleaks, OSV-Scanner, Biome, the type check, the build,
  # OSV security patches on main, and on main the GitHub Pages deploy.
  website:
    needs: [markdown]
    uses: apollogeddon/forgejs/.github/workflows/website.yml@main
    # GitHub checks every called job's permissions, including the ones these inputs skip
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
      pull-requests: write
    with:
      working_directory: webpage
      node_version: "22"
      run_tests: false
      enable_versioning: false
      auto_merge: false
