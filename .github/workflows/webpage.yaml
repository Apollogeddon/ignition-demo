name: Webpage

on:
  push:
    branches: [main]
    paths: [webpage/**, .github/workflows/webpage.yaml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webpage/package-lock.json

      - name: Install dependencies
        run: cd webpage && npm ci

      - name: Build site
        run: cd webpage && npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: webpage/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
