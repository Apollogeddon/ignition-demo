name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  projects:
    name: Projects
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  resources:
    name: Sanitised resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with pytest pytest -q scripts/tests
      - run: git ls-files -z -- '*resource.json' | xargs -0 uv run --no-project scripts/sanitise.py --check

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive deploy
      - name: Validate the modules and the infra stage
        run: |
          for dir in deploy/modules/platform deploy/modules/gateway deploy/environments/k3s/infra; do
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

  image:
    name: Gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: ignition-demo-gateway:ci
