name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  projects:
    name: Projects (Ignition ${{ matrix.ignition }} API)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the uv dependency group with that version's API stubs
        ignition: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: projects
    env:
      UV_NO_DEFAULT_GROUPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --locked --group dev --group "ignition${IGNITION/./}"
        env:
          IGNITION: ${{ matrix.ignition }}
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest

  resources:
    name: Resources and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Sanitiser tests
        run: uv run --no-project --with pytest pytest -q scripts/tests
      - name: Project resources are sanitised
        run: git ls-files -z -- '*resource.json' | xargs -0 uv run --no-project scripts/sanitise.py --check
      - name: Asset installer tests
        run: bash gateway/tests/install-assets_test.sh
      - name: API key bootstrap tests
        run: bash gateway/tests/api-token_test.sh
      - name: 8.1 gateway events match the event script files
        run: |
          scripts/generate-event-scripts.sh
          git diff --exit-code -- 'projects/*/src/ignition/event-scripts' \
            || { echo "::error::run scripts/generate-event-scripts.sh and commit the result"; exit 1; }

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - run: tofu fmt -check -recursive cluster develop
      - name: Validate the modules and the infra stage
        run: |
          for dir in cluster/modules/platform cluster/modules/gateway cluster/environments/k3s/infra; do
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

  image:
    name: Gateway image (Ignition ${{ matrix.ignition }})
    runs-on: ubuntu-latest
    needs: [projects, resources]
    strategy:
      matrix:
        ignition: ["8.1.55", "8.3.10"]
    permissions:
      contents: read
      packages: write
    env:
      # pull requests only build and test; main and v* tags publish to GHCR
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          build-args: IGNITION_VERSION=${{ matrix.ignition }}
          load: true
          tags: ignition-gateway:test
          cache-from: type=gha,scope=${{ matrix.ignition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ignition }}
      - name: Smoke test
        run: gateway/tests/smoke.sh ignition-gateway:test
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ignition-gateway
          # every tag carries the Ignition version: 8.3.10-main,
          # 8.3.10-sha-<commit>, 8.3.10-1.2.0
          flavor: prefix=${{ matrix.ignition }}-,onlatest=true
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          build-args: IGNITION_VERSION=${{ matrix.ignition }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.ignition }}
