version: 2

registries:
  # @apollogeddon/forgejs lives on GitHub Packages, which needs a token even to read
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.FORGEJS_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/webpage"
    registries:
      - github-packages
    # Weekly and grouped: one pull request, so one CI run, for the week's updates.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    # Wait 3 days after a version is published before proposing it, so a
    # compromised release has time to be caught/yanked upstream first.
    cooldown:
      default-days: 3

  - package-ecosystem: "uv"
    directory: "/projects"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
    # pinned to the Ignition versions the projects target, one per dependency group
    ignore:
      - dependency-name: "ignition-api-stubs"
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    # CI deliberately tracks forgejs's reusable workflows at @main.
    ignore:
      - dependency-name: "apollogeddon/forgejs"
    cooldown:
      default-days: 3
