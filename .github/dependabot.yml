version: 2
# @apollogeddon packages come from GitHub Packages, which Dependabot can't read without a
# token, even for a public package: PACKAGES_TOKEN is a read:packages Dependabot secret.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    # No .npmrc is committed (it holds a token), so name the scope this registry serves.
    scope: "@apollogeddon"
    token: ${{ secrets.PACKAGES_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/webpage"
    # Weekly and grouped: one pull request, so one CI run, for the week's updates.
    registries:
      - npm-github
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # our own packages, apart from the rest so they never wait on a third-party update
      apollogeddon:
        patterns: ["@apollogeddon/*"]
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    # Wait 3 days after a version is published before proposing it, so a
    # compromised release has time to be caught/yanked upstream first.
    # astro-mermaid accepts mermaid 10 or 11 only, so a major mermaid update
    # breaks the webpage's install until astro-mermaid supports it
    ignore:
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 3
      # we published them, so the wait for a yanked release doesn't apply
      exclude: ["@apollogeddon/*"]

  - package-ecosystem: "uv"
    directory: "/projects"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
    # pinned to the Ignition versions the projects target, one per dependency group
    ignore:
      - dependency-name: "ignition-api-stubs"
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 3

  # The Ignition releases the gateway image builds on, one directory per release line, so
  # each line only moves to its own patch releases. A bump fails
  # scripts/check-ignition-versions.sh, which lists every other place to move on with it.
  - package-ecosystem: "docker"
    directories:
      - "/gateway/base/8.1"
      - "/gateway/base/8.3"
    schedule:
      interval: "weekly"
    groups:
      ignition:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 3

  # The Kubernetes, Helm and random providers. The config stages use only the Ignition
  # provider, which is on no registry, so they aren't listed.
  - package-ecosystem: "opentofu"
    directories:
      - "/cluster/modules/platform"
      - "/cluster/modules/gateway"
      - "/cluster/environments/k3s/infra"
    schedule:
      interval: "weekly"
    groups:
      providers:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    # CI deliberately tracks the forge reusable workflows at @main.
    ignore:
      - dependency-name: "apollogeddon/forgejs"
      - dependency-name: "apollogeddon/forgepy"
    cooldown:
      default-days: 3
