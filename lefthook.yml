# Lefthook Configuration
# Refer to https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-commit:
  commands:
    projects-lint:
      root: projects/
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true
    projects-compat:
      root: projects/
      glob: "*/src/**/*.py"
      run: uv run poe compat
    shellcheck:
      glob: "*.sh"
      # CI runs shellcheck on every script, so the hook doesn't insist it's installed
      run: |
        if command -v shellcheck >/dev/null; then shellcheck {staged_files}
        else echo "shellcheck isn't installed: skipping, CI checks the scripts"; fi
