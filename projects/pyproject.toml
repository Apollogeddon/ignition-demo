[project]
name = "ignition-projects"
version = "0.1.0"
description = "Tooling for the Ignition projects: lint, type-check and unit-test their scripts"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["forgepy[toolchain]", "vermin>=1.8"]

# Ignition API stubs: one group per gateway version; CI checks both
ignition83 = ["ignition-api-stubs==8.3.9.post1"]
ignition81 = ["ignition-api-stubs==8.1.55"]

[tool.uv]
package = false
default-groups = ["dev", "ignition83"]
conflicts = [[{ group = "ignition81" }, { group = "ignition83" }]]


[tool.uv.sources]
forgepy = {git = "https://github.com/apollogeddon/forgepy"}

[tool.coverage.report]
# type-only imports never run
exclude_also = ["if MYPY:"]

[tool.coverage.run]
source = ["library/src/ignition/script-python", "project/src/ignition/script-python"]

[tool.poe.tasks]
format = "ruff format ."
security = "osv-scanner scan -r ."
sync-check = "forgepy sync --check"
type = "basedpyright"
test = "pytest"

[tool.poe.tasks.lint]
shell = "ruff check --fix . && ruff format ."

[tool.poe.tasks.compat]
shell = "vermin --target=2.7- --violations --no-tips --eval-annotations --exclude typing library/src project/src && forgepy check-jython library/src project/src"
