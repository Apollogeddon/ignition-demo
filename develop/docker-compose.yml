# Local development: the gateway image at the Ignition version of your choice,
# with the library and project folders mounted live, plus the demo database.
#
#   cp develop/.env.example develop/.env      # then set the passwords
#   docker compose -f develop/docker-compose.yml up -d --build
#
# Gateway: http://localhost:${GATEWAY_HTTP_PORT:-8088} (admin / IGNITION_ADMIN_PASSWORD)
# The Designer writes straight into projects/*/src; test and commit from there.
name: ignition

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
      args:
        IGNITION_VERSION: ${IGNITION_VERSION:-8.3.10}
    image: ignition-gateway:develop-${IGNITION_VERSION:-8.3.10}
    hostname: gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-8088}:8088"
      - "${GATEWAY_HTTPS_PORT:-8043}:8043"
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      DISABLE_QUICKSTART: "true"
      IGNITION_EDITION: standard
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: ${IGNITION_ADMIN_PASSWORD:?set it in develop/.env}
      # 8.1 only: variables for the seed spec (gateway/seed/seed.json), which
      # the startup event applies; 8.3 gets its configuration from
      # develop/config through the REST API
      GATEWAY_DB_DEMO_URL: jdbc:postgresql://database:5432/demo
      GATEWAY_DB_DEMO_USER: demo
      GATEWAY_DB_DEMO_PASSWORD: ${DB_PASSWORD:?set it in develop/.env}
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:?set it in develop/.env}
      # 8.3 only: the API key develop/config authenticates with (installed by
      # gateway/api-token.sh; empty installs none)
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-}
    command:
      - -n
      - ignition-develop
      - -m
      - "${GATEWAY_MEMORY_MB:-1024}"
      - --
      - gateway.useProxyForwardedHeader=true
      - -Dignition.projects.dir=/usr/local/bin/ignition/assets/projects
      # pick up file changes quickly while developing (the cluster uses 60)
      - -Dignition.projects.scanFrequency=10
    volumes:
      - gateway-data:/usr/local/bin/ignition/data
      # live project folders: the Designer edits these files directly, and
      # edits made in an editor are picked up within scanFrequency seconds
      - ../projects/library/src:/usr/local/bin/ignition/assets/projects/library
      - ../projects/project/src:/usr/local/bin/ignition/assets/projects/project
      # the seed spec, live (8.1 applies it on start and after project changes)
      - ../gateway/seed:/usr/local/bin/ignition/assets/seed:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/StatusPing | grep -q RUNNING"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  database:
    image: docker.io/library/postgres:17
    hostname: database
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in develop/.env}
    volumes:
      - database-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gateway-data:
  database-data:
